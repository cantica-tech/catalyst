# catalyst's own operations. Mirrors .github/workflows/*.yml exactly, so
# `task check:all` (or `task ci`) is what CI runs, runnable locally.
#
# catalyst never adds to or edits a project's Taskfile, this one included:
# its commands run from the criterion's own Taskfile.common.yml, with
# `catalyst task <command> -- <args>`.

version: "3"

tasks:
  install:
    desc: "Install Python test dependencies into the active environment"
    cmds:
      - pip install -r requirements-dev.txt

  test:
    desc: "Run the pytest suite"
    cmds:
      - pytest

  check:deployment:
    desc: "Validate catalyst deployment structure (scripts/check_deployment.py)"
    cmds:
      - python3 scripts/check_deployment.py

  check:command-parity:
    desc: "Validate .claude/commands/ and Taskfile.common.yml against CODE-OF-CONDUCT.md §4"
    cmds:
      - python3 scripts/check_command_parity.py

  check:plugins:
    desc: "Validate plugin rules (scripts/check_plugins.py)"
    cmds:
      - python3 scripts/check_plugins.py

  check:plugin-contracts:
    desc: "Validate plugin contracts (scripts/check_plugin_contracts.py)"
    cmds:
      - python3 scripts/check_plugin_contracts.py

  check:kernel-purity:
    desc: "Validate that the kernel names no process module or module entity (INV-30, scripts/check_kernel_purity.py)"
    cmds:
      - python3 scripts/check_kernel_purity.py

  check:all:
    desc: "Run every validation script plus the test suite (what CI runs)"
    cmds:
      - task: check:deployment
      - task: check:command-parity
      - task: check:plugins
      - task: check:plugin-contracts
      - task: check:kernel-purity
      - task: test

  build:cli:
    desc: "Build the single-file catalyst CLI into dist/catalyst.pyz"
    cmds:
      - python3 -c 'import sys; sys.path.insert(0, "scripts"); from pathlib import Path; import package_release as p; print(p.build_cli(Path("."), Path("dist/catalyst.pyz")))'

  catalyst:
    desc: "Run the catalyst CLI from source: task catalyst -- <args>"
    env:
      PYTHONPATH: scripts
    cmds:
      - python3 -m catalyst {{.CLI_ARGS}}

  release:
    desc: "Package the kernel and modules into versioned zipped archives with manifests (no commit, no push)"
    cmds:
      - python3 scripts/package_release.py
      - task: check:command-parity
      - task: check:plugins
      - task: check:plugin-contracts
      - task: check:kernel-purity
      - task: test

  release:publish:
    desc: "Package, copy releases into PUBLISH_DIR (a distribution repository checkout), then commit and push the module repositories and PUBLISH_DIR"
    requires:
      vars: [PUBLISH_DIR]
    cmds:
      - python3 scripts/package_release.py --publish-dir "{{.PUBLISH_DIR}}" --push
