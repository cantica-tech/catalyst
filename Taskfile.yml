# catalyst's own operations. Mirrors .github/workflows/*.yml exactly, so
# `task check:all` (or `task ci`) is what CI runs, runnable locally.
#
# catalyst never adds to or edits a project's Taskfile, this one included:
# its commands run from the criterion's own Taskfile.common.yml, with
# `catalyst task <command> -- <args>`.

version: "3"

includes:
  # cantica-tech code standards: `task lint`, `task format`, `task typecheck`, `task standards:sync`,
  # `task standards:check` — from a checkout of the standards repository next to this one (STANDARDS_DIR).
  standards:
    taskfile: '{{.STANDARDS_DIR | default "../standards"}}/Taskfile.standards.yml'
    optional: true
    flatten: true
    excludes: [lint, format, typecheck] # this repository's own wrappers below say so when the checkout is missing

tasks:
  lint:
    desc: "Lint with the cantica-tech standards (Ruff, Markdown, YAML, workflows), as CI's Standards job"
    preconditions: &standards
      # Without the standards checkout the include above is skipped (optional): stop and say so, rather than
      # pass having checked nothing while CI's Standards job checks Python, Markdown, YAML and workflows.
      - sh: test -f "${STANDARDS_DIR:-../standards}/Taskfile.standards.yml"
        msg: >-
          The cantica-tech standards are not checked out at {{.STANDARDS_DIR | default "../standards"}}, so this task
          cannot run the checks CI's Standards job runs. Clone git@github.com:cantica-tech/standards.git next to
          this repository, or set STANDARDS_DIR to its checkout.
    cmds:
      - task: standards:lint

  format:
    desc: "Format the code with the cantica-tech standards"
    preconditions: *standards
    cmds:
      - task: standards:format

  typecheck:
    desc: "Type-check with the cantica-tech standards (pyright)"
    preconditions: *standards
    cmds:
      - task: standards:typecheck

  install:
    desc: "Install Python test dependencies into the active environment"
    cmds:
      - pip install -r requirements-dev.txt

  test:
    desc: "Run the pytest suite"
    cmds:
      - pytest

  check:deployment:
    desc: "Validate catalyst deployment structure (scripts/check_deployment.py)"
    cmds:
      - python3 scripts/check_deployment.py

  check:command-parity:
    desc: "Validate Taskfile.common.yml and the module's commands against CODE-OF-CONDUCT.md §4"
    cmds:
      - python3 scripts/check_command_parity.py

  check:kernel-purity:
    desc: "Validate that the kernel names no process module or module entity (INV-30, scripts/check_kernel_purity.py)"
    cmds:
      - python3 scripts/check_kernel_purity.py

  check:all:
    desc: "Run every validation script plus the test suite (what CI runs)"
    cmds:
      - task: check:deployment
      - task: check:command-parity
      - task: check:kernel-purity
      - task: test

  build:cli:
    desc: "Build the single-file catalyst CLI into dist/catalyst.pyz"
    cmds:
      - python3 -c 'import sys; sys.path.insert(0, "scripts"); from pathlib import Path; import package_release as p; print(p.build_cli(Path("."), Path("dist/catalyst.pyz")))'

  catalyst:
    desc: "Run the catalyst CLI from source: task catalyst -- <args>"
    env:
      PYTHONPATH: scripts
    cmds:
      - python3 -m catalyst {{.CLI_ARGS}}

  release:
    desc: "Package the kernel and modules into versioned zipped archives with manifests under catalyst/ (no commit, no push)"
    cmds:
      - python3 scripts/package_release.py
      - task: check:command-parity
      - task: check:kernel-purity
      - task: test

  release:publish:
    desc: "Package the tagged kernel and modules (each checkout at its version's tag), copy the releases into PUBLISH_DIR (a distribution repository checkout, their only home), then commit and push PUBLISH_DIR; nothing goes into a module repository. task release:publish PUBLISH_DIR=<dir> -- [--module <id>] [--no-kernel]"
    requires:
      vars: [PUBLISH_DIR]
    cmds:
      - python3 scripts/package_release.py --publish-dir "{{.PUBLISH_DIR}}" --push {{.CLI_ARGS}}
