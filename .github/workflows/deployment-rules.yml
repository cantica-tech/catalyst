name: Deployment Rules

on:
  pull_request:
  push:
    branches:
      - development

permissions:
  contents: read

jobs:
  validate-deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
      - name: Check out catalogued process modules
        run: |
          mkdir -p "$RUNNER_TEMP/modules"
          # shellcheck disable=SC2016  # the backticks are the catalog's Markdown, matched literally
          grep -E '^\| `[a-z0-9-]+` \|' framework/modules/catalog.md | while IFS='|' read -r _ id repo branch _; do
            id=$(echo "$id" | tr -d ' `'); repo=$(echo "$repo" | tr -d ' `'); branch=$(echo "$branch" | tr -d ' `')
            url=$(echo "$repo" | sed -E 's#^git@github.com:#https://github.com/#')
            git clone --depth=1 -b "$branch" "$url" "$RUNNER_TEMP/modules/$id"
          done
      # A clean checkout has no criterion (it lives in catalyst's home), so the
      # checks run against a deployment installed, in a scratch catalyst home,
      # from this checkout's kernel
      # and each catalogued module, with --require: finding nothing to check
      # fails the job instead of skipping.
      - name: Install a scratch deployment per module and validate it
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
          # a scratch deployment signs through catalyst-users' static backend, which verifies nobody: tests only
          CATALYST_ALLOW_STATIC_IDENTITY: "1"
        run: |
          set -e
          git config --global user.name "catalyst-ci"
          git config --global user.email "catalyst-ci@localhost"
          [ -n "$(ls -A "$RUNNER_TEMP/modules")" ] || { echo "no catalogued module checked out"; exit 1; }
          for dir in "$RUNNER_TEMP"/modules/*/; do
            id=$(basename "$dir")
            proj="$RUNNER_TEMP/deployments/$id/project"
            mkdir -p "$proj"
            git -C "$proj" init -q
            git -C "$proj" commit -q --allow-empty -m "scratch project"
            # the home layout, as every deployment: the criterion goes to $CATALYST_HOME/projects/ci/criterion,
            # one scratch home per module
            export CATALYST_HOME="$RUNNER_TEMP/deployments/$id/home"
            (cd "$proj" && python3 -m catalyst init --kernel "$GITHUB_WORKSPACE/framework/kernel" \
              --name ci --module "$id" --module-dir "$dir" --user "CI" --git-username catalyst-ci \
              --agent claude-code)
            echo "::group::$id"
            (cd "$proj" && python3 "$GITHUB_WORKSPACE/scripts/check_deployment.py" --require)
            (cd "$proj" && python3 "$GITHUB_WORKSPACE/scripts/check_command_parity.py" --require)
            (cd "$proj" && python3 -m catalyst check)
            echo "::endgroup::"
          done
      - name: Validate the kernel is module-agnostic (INV-30)
        env:
          CATALYST_MODULES_DIR: ${{ runner.temp }}/modules
        run: python3 scripts/check_kernel_purity.py
      - name: Every new commit cites an artifact or rule ID, or is a chore (catalyst trace)
        env:
          PYTHONPATH: scripts
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          range=$(python3 scripts/ci_range.py --event "$EVENT" --sha "$SHA" --before "$BEFORE" --base "$BASE" --head "$HEAD")
          python3 -m catalyst trace --pattern-only "$range"

  # Every pushed commit's changes are in the journal (REQ-000117). The journal is in the private criterion
  # repository named by catalyst.toml, cloned with a read-only deploy key (the secret CRITERION_DEPLOY_KEY) into a
  # scratch catalyst home; this checkout's CLI then runs `unrecorded --strict` and a full `trace` over the range.
  # A commit's entries reach the shared criterion only when its criterion pull request is merged, so the check is
  # required on a pull request into main or release (merge the criterion PR first, CONTRIBUTING.md) and a warning
  # elsewhere (a development push lands before its criterion PR is merged). Without the secret (a fork's pull
  # request, or before it is configured) the job says so and checks nothing.
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
      - name: Clone the criterion (private, read-only deploy key)
        id: criterion
        env:
          CRITERION_DEPLOY_KEY: ${{ secrets.CRITERION_DEPLOY_KEY }}
        run: |
          if [ -z "$CRITERION_DEPLOY_KEY" ]; then
            echo "::notice title=Journal not checked::the secret CRITERION_DEPLOY_KEY is not available (a fork's pull request, or not configured), so the criterion cannot be cloned; unrecorded changes are not checked"
            echo "cloned=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          export CATALYST_HOME="$RUNNER_TEMP/catalyst"
          echo "CATALYST_HOME=$CATALYST_HOME" >> "$GITHUB_ENV"
          install -d -m 700 ~/.ssh
          key="$RUNNER_TEMP/criterion-key"
          (umask 077 && printf '%s\n' "$CRITERION_DEPLOY_KEY" > "$key")
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          read -r name url branch < <(python3 -c 'import tomllib; d = tomllib.load(open("catalyst.toml", "rb")); print(d["project_name"], d["catalyst_repo_url"], d.get("criterion_branch") or "criterion")')
          GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes" \
            git clone -q -b "$branch" "$url" "$CATALYST_HOME/projects/$name/criterion"
          rm -f "$key"
          echo "cloned=true" >> "$GITHUB_OUTPUT"
      - name: Every commit's changes are in the journal (catalyst unrecorded --strict, catalyst trace)
        if: steps.criterion.outputs.cloned == 'true'
        env:
          PYTHONPATH: scripts
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          range=$(python3 scripts/ci_range.py --event "$EVENT" --sha "$SHA" --before "$BEFORE" --base "$BASE" --head "$HEAD")
          python3 -m catalyst where
          status=0
          python3 -m catalyst unrecorded --strict "$range" || status=1
          python3 -m catalyst trace "$range" || status=1
          [ "$status" -eq 0 ] && exit 0
          if [ "$EVENT" = "pull_request" ] && { [ "$BASE_REF" = "main" ] || [ "$BASE_REF" = "release" ]; }; then
            echo "::error title=Unjournaled changes::a commit in $range changes a governed file the criterion's journal does not record, or cites no artifact; merge its criterion pull request first (CONTRIBUTING.md), or journal it (catalyst journal adopt)"
            exit 1
          fi
          echo "::warning title=Unjournaled changes::a commit in $range is not in the shared criterion's journal yet; expected until its criterion pull request is merged, required before the pull request into main (CONTRIBUTING.md)"
