name: Plugin Rules

on:
  pull_request:
  push:
    branches:
      - development

permissions:
  contents: read

jobs:
  validate-plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
      - name: Validate plugin rules
        run: python3 scripts/check_plugins.py
      - name: Validate plugin contracts
        run: python3 scripts/check_plugin_contracts.py --require
