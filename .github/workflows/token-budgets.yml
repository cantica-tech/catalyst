name: Token Budget Check

on:
  pull_request:
  push:
    branches:
      - development

jobs:
  token-budgets:
    name: Token budget regression check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      
      - name: Check token budgets
        run: python scripts/test_token_budgets.py
      
      - name: (Baseline generation) Measure tokens
        if: failure()  # Only after a failure, for manual baseline updates
        run: python scripts/measure_tokens.py > token-report.md
      
      - name: Upload token report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: token-report
          path: token-report.md
          retention-days: 30
