name: Tests

on:
  pull_request:
  push:
    branches:
      - development

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # Windows is a target but not passing yet (symlinks, POSIX paths, shebangs):
    # it runs and reports without failing the build until it does.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.13']           # the declared floor (pyproject.toml) and a current release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Configure git for the tests' scratch repositories
        run: |
          git config --global user.name "catalyst-ci"
          git config --global user.email "catalyst-ci@localhost"
          git config --global init.defaultBranch main
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
