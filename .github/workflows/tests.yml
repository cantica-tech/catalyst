name: Tests

on:
  pull_request:
  push:
    branches:
      - development

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']          # the declared floor (pyproject.toml) and a current release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: The second module, a fixture (R7; tests/test_second_module.py)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          repository: cantica-tech/catalyst-cantica-knowledge-base
          ref: 0.1.0
          path: _fixtures/catalyst-cantica-knowledge-base
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Configure git for the tests' scratch repositories
        run: |
          git config --global user.name "catalyst-ci"
          git config --global user.email "catalyst-ci@localhost"
          git config --global init.defaultBranch main
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        env:
          CATALYST_KB_MODULE: ${{ github.workspace }}/_fixtures/catalyst-cantica-knowledge-base
          CATALYST_REQUIRE_FIXTURES: "1"  # the fixture module is present here: its test may not skip
        run: python -m pytest -q
